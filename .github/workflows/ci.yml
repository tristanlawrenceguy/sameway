name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Repo check (file sizes, component folders, tokens)
        run: go run ./tools/check
      - name: Test (includes golden component output)
        run: go test ./...
      - name: Build
        run: go build -o bin/sameway ./cmd/sameway

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runner
        working-directory: tools/a11y-runner
        run: npm install
      - name: axe-core over every component example
        working-directory: tools/a11y-runner
        run: npm test
