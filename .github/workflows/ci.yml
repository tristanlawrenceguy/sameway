name: ci

on:
  push:
    branches: [main]
  pull_request:

# A pull request pushed to again, or brought up to date with main, is
# checked again; the run for what it was before is no use any more and
# only holds runners the newer one waits for. Sixteen runs once queued at
# a time, each of nine jobs, so a run of fifteen minutes' work took most
# of an hour. A newer run on the same pull request cancels the older one.
# Every push to main is still checked to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The fast checks run first; the browser jobs wait for them, so a format,
  # vet, size or debt-list failure is reported in a minute or two and
  # nothing slow starts. The tests run alongside, as they take longest.
  check:
    name: check (format, vet, sizes, debt list only goes down)
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # The browser jobs check what a page is drawn from: templates, css,
      # scripts, the server and the components. A pull request that changes
      # only what the assistant is told (internal/chat, llm, mcp), words
      # (*.md, docs) or tests (*_test.go) cannot change those, and running
      # seven browser jobs for it held runners other runs queued behind.
      # Anything else, and every push to main, runs them all.
      - name: Does this change what a page is drawn from?
        id: scope
        run: |
          browser=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only --no-renames HEAD^1 HEAD) # a file moved here is gone from where it was, too
            other=$(printf '%s\n' "$changed" | grep -v -E '^(internal/chat/|internal/llm/|internal/mcp/|docs/)|\.md$|_test\.go$' | grep -v '^$' || true)
            if [ -n "$changed" ] && [ -z "$other" ]; then browser=false; fi
            echo "changed:"; printf '%s\n' "$changed"
          fi
          echo "browser jobs: $browser"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Repo check (file and function sizes, debt list, component folders, tokens)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch -q --depth=1 origin "$BASE" 2>/dev/null || true
          go run ./tools/check -base "$BASE"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test (contracts, golden output, HTTP, CLI, chat tools)
        run: go test ./...
      - name: Build
        run: go build -o bin/sameway ./cmd/sameway

  components:
    name: components in a browser (axe, modes, reflow, spacing, keyboard)
    needs: check
    if: needs.check.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install runner
        working-directory: tools/a11y-runner
        run: npm ci
      - name: axe-core, dark mode, reflow, text spacing and motion over every component example
        working-directory: tools/a11y-runner
        run: npm run test:axe
      - name: Keyboard operation of every component example
        working-directory: tools/a11y-runner
        run: npm run test:keyboard
      - name: What the page scripts do (arm, refresh, bus, connection)
        working-directory: tools/a11y-runner
        run: npm run test:behave

  pages:
    # Every page in every mode took 42 minutes on one machine, and every
    # merge waited on it; the pages are shared out over six (site.mjs,
    # SITE_SHARD), and the first also checks the site as a whole.
    name: live pages (person and agent paths, every page in every mode) ${{ matrix.part }}/6
    needs: check
    if: needs.check.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build and start a workspace with no model
        run: |
          go build -o bin/sameway ./cmd/sameway
          ./bin/sameway init /tmp/ws
          printf 'name: CI\nllm:\n  provider: none\n' > /tmp/ws/workspace.yaml
          ./bin/sameway --workspace /tmp/ws serve --addr 127.0.0.1:8080 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/describe > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/describe > /dev/null || (cat /tmp/serve.log; exit 1)
      - name: Install runner
        working-directory: tools/a11y-runner
        run: npm ci
      - name: Drive the pages as a person
        if: matrix.part == 1
        working-directory: tools/a11y-runner
        run: node pages.mjs
        env:
          SAMEWAY_URL: http://127.0.0.1:8080
      - name: Every page in every mode, part ${{ matrix.part }} of 6
        working-directory: tools/a11y-runner
        run: node site.mjs
        env:
          SAMEWAY_URL: http://127.0.0.1:8080
          SITE_SHARD: ${{ matrix.part }}/6
      - name: Moving and in motion
        if: matrix.part == 1
        working-directory: tools/a11y-runner
        run: node move.mjs && node motion.mjs
        env:
          SAMEWAY_URL: http://127.0.0.1:8080
      - name: Do everyday tasks as a browser agent, by role and name only
        if: matrix.part == 1
        working-directory: tools/a11y-runner
        run: npm run test:agent
        env:
          SAMEWAY_URL: http://127.0.0.1:8080
      - name: Server log
        if: failure()
        run: cat /tmp/serve.log
