name: mac-sign-trial
on: pull_request
jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSLo rcodesign.tar.gz https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  rcodesign.tar.gz" | sha256sum -c
          tar -xzf rcodesign.tar.gz --strip-components=1 -C "$RUNNER_TEMP" apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: |
          curl -sSLO https://github.com/tristanlawrenceguy/sameway/releases/download/v0.1.1/Sameway-Mac-AppleSilicon.zip
          unzip -q Sameway-Mac-AppleSilicon.zip
          rcodesign sign Sameway.app
          rcodesign verify Sameway.app/Contents/MacOS/sameway
          rcodesign print-signature-info Sameway.app/Contents/MacOS/sameway | head -60
          find Sameway.app
