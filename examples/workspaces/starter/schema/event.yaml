# Something that happens at a time: a meeting, a birthday, a train. A
# meeting with a recording is written up from its transcript: a summary,
# what was decided, and tasks that came up at it (write_up_meeting).
# Provided with every workspace, so a calendar brought in from Google,
# Outlook or Apple (.ics) has somewhere to go, and it shows on the calendar.
name: event
description: Something that happens at a time, such as a meeting or a birthday, with when and where; made here, or brought in from a calendar (.ics). A meeting can keep its recording, and what was said and decided at it.
title: title
provided: true
fields:
  title:
    type: string
    required: true
    maxLength: 200
  starts:
    type: datetime
    description: When it starts; a day alone for one that lasts all day.
  ends:
    type: datetime
    description: When it ends, when that is known.
  where:
    type: string
    label: Where
    description: Where it is, or the link to join it.
  people:
    type: list
    of: ref
    to: person
    label: People
    description: Who is in it.
  repeat:
    type: repeat
    description: How often it happens again, in words, like every Monday or every year; empty for once.
  notes:
    type: markdown
    description: Anything else about it.
  recording:
    type: ref
    to: file
    label: Recording
    description: The recording of it, when there is one; a meeting is written up from its transcript.
  summary:
    type: markdown
    description: What was said, in short, written up from the recording or by hand.
  decisions:
    type: markdown
    description: What was decided, one a line, each with where in the recording it was said.
  uid:
    type: string
    hidden: true
    description: The calendar's own name for it, so bringing the same calendar in again adds nothing twice.
