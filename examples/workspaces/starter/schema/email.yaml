# An email that came in: what you sent or forwarded to your workspace.
# One coming in can set off any action, as any record can.
name: email
description: An email that came in to your workspace, with who it was from and when.
title: subject
provided: true
fields:
  subject:
    type: string
    required: true
    maxLength: 300
  from:
    type: string
    description: Who sent it, as the email says.
  received:
    type: datetime
    description: When it was sent.
  body:
    type: markdown
    description: What it says, with links to the files that came with it.
  tags:
    type: list
    of: string
    description: Tags, by you or by a classify action.
  message_id:
    label: Message ID
    type: string
    description: The email's own Message-Id, kept by the system, which replies name to say what they answer.
    readonly: true
  thread:
    label: Thread
    type: ref
    to: email
    listed: true
    description: The email that started the conversation this one is part of, kept by the system from what the email says it answers. That email's page lists the conversation in order.
    readonly: true
  from_me:
    label: Sent by me
    type: bool
    default: false
    description: Whether you sent it (read from your Sent folder because it answers a conversation here), kept by the system.
    readonly: true
