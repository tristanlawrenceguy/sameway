# Something you asked another person's Sameway for, through your
# assistant, and what became of it. Provided with every workspace, the
# mirror of an enquiry: Sameway keeps each one with the address their
# Sameway gave for it, reads that address now and then, and tells you
# when they answer. What was asked is as their Sameway wrote it back.
name: ask
description: "Something the owner asked another person's own Sameway for, through ask_page, and what became of it: kept with the address their Sameway gave, which Sameway reads now and then, telling the owner when they say yes or no. Asked what you asked others for, or whether they answered, read these; to act on an answer, such as putting what they agreed to on the calendar, make an action that waits for an ask to come to state=yes."
title: asked
provided: true
owners: true
fields:
  asked:
    type: string
    required: true
    maxLength: 300
    description: What was asked for, as their Sameway wrote it back.
  at:
    label: Answer at
    type: string
    maxLength: 300
    readonly: true
    description: The address on their Sameway that says what became of it, kept by the system.
  state:
    type: enum
    values: [waiting, "yes", "no"]
    labels: {waiting: Waiting for them, "yes": They said yes, "no": They said no}
    default: waiting
