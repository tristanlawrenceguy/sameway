# The activity log: every change to the canvas, by a person, the assistant, or an agent.
# Written by the system; read at /activity, /api/activity, and `sameway activity list`.
name: activity
description: One recorded action, with who did it and what it touched.
internal: true
owners: true
title: summary
fields:
  summary:
    type: string
    description: The whole event as one sentence, such as "Assistant added card Shopping". What lists and headings show.
  actor:
    type: enum
    values: [human, assistant, agent, system]
    required: true
    description: Who made the change. human is a person; assistant is the assistant in the app; agent is a program outside Sameway, over MCP or through the API, named in by; system is the workspace itself.
  action:
    type: string
    required: true
    description: Past-tense verb such as added, updated, removed, cleared, failed.
  target:
    type: string
    description: What was acted on, such as the component name.
  target_id:
    type: string
    description: Record id of the thing acted on, when it still exists.
  detail:
    type: text
    description: Human readable summary.
  before:
    type: json
    description: What the thing was before this change, kept so the change can be undone. Absent when nothing existed before.
  undoes:
    type: string
    description: The id of the entry this one reversed, when this entry is an undo.
  via:
    type: string
    description: The device the change was made from when it was not the machine serving, such as a phone over the tailnet; or the way an agent or a script came in, such as through MCP or through the API.
  by:
    type: string
    description: Who made the change when it was not the workspace's owner, by name, for someone given access over Tailscale; for an agent, the name it gave, such as Claude Code, empty when it gave none.
  by_login:
    type: string
    description: Who made the change by their Tailscale login, when known, the owner included, so it reads as theirs on the other computers that host the workspace.
