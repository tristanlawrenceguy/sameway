# The activity log: every change to the canvas, by a person or the assistant.
# Written by the system; read at /activity, /api/activity, and `sameway activity list`.
name: activity
description: One recorded action, with who did it and what it touched.
internal: true
title: summary
fields:
  summary:
    type: string
    description: The whole event as one sentence, such as "Assistant added card Shopping". What lists and headings show.
  actor:
    type: enum
    values: [human, assistant, system]
    required: true
  action:
    type: string
    required: true
    description: Past-tense verb such as added, updated, removed, cleared, failed.
  target:
    type: string
    description: What was acted on, such as the component name.
  target_id:
    type: string
    description: Record id of the thing acted on, when it still exists.
  detail:
    type: text
    description: Human readable summary.
  before:
    type: json
    description: What the thing was before this change, kept so the change can be undone. Absent when nothing existed before.
  undoes:
    type: string
    description: The id of the entry this one reversed, when this entry is an undo.
