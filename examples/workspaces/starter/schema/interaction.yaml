# One dealing with a person: a call, an email, a meeting, a message. Provided
# with every workspace, so a mailbox or a call log can be imported as the
# history with each person, and a follow-up shows on the calendar.
name: interaction
description: "One dealing with a person: a call, an email, a meeting or a message, when it was, what it was about, and when to follow up."
title: summary
provided: true
fields:
  summary:
    type: string
    required: true
    maxLength: 200
    description: "What it was about, in a line; the subject of an email."
  person:
    type: ref
    to: person
    description: Who it was with. An import links by their email, phone or name, and makes the person when new.
  kind:
    type: enum
    values: [call, email, meeting, message, note]
    default: note
  at:
    type: datetime
    description: When it happened.
  follow_up:
    type: datetime
    description: When to get back to them; it shows on the calendar and the clock.
  notes:
    type: markdown
    description: What was said, or the first of an email.
