# An action: a button that does something, inside Sameway or outside it.
# Ask the assistant to make one, then put it on a button, or press Run on
# its page.
name: action
description: "A button that does something, pressed by you, by the assistant, on a schedule, or from outside. A webhook calls a URL of yours (an alarm, a weather service); an mqtt action publishes to a topic on your broker (a light, a plug, a hub); a command runs a program this workspace has allowed, on this machine as you, once you have accepted the line; an arrangement lays out a page; a message says something to the assistant for you."
title: title
provided: true
fields:
  title:
    type: string
    required: true
    maxLength: 80
    description: What the button says, such as Turn on the alarm.
  kind:
    label: What it does
    type: enum
    values: [webhook, mqtt, command, arrangement, message, classify, suggest]
    labels: {webhook: Call a web address, mqtt: Tell a device, command: Run a program on this computer, arrangement: Set up a page, message: Ask the assistant, classify: Tag what set it off, suggest: Suggest a record from what set it off}
    default: webhook
  url:
    label: URL
    type: string
    description: For a webhook, the address to call, starting with http:// or https://.
  method:
    label: HTTP method
    type: enum
    values: [POST, GET]
    default: POST
  body:
    type: text
    description: For a webhook, what to send. JSON is sent as JSON, anything else as text.
  topic:
    type: string
    description: "For an mqtt action, the topic to publish to: zigbee2mqtt/kitchen_light/set, or a device's set topic."
  payload:
    type: text
    description: "For an mqtt action, what to publish: ON, or JSON such as {\"state\": \"ON\", \"brightness\": 200}."
  command:
    type: text
    description: "For a command action, the program to run and its arguments, on this machine as you, such as: curl -s https://example.com/ping. Only a program named in actions.allow in workspace.yaml runs, and it runs directly, not through a shell: no pipes, no redirects, no second command. The first press asks you once, showing this line; after you accept, the button just runs it. Change the line and it asks again."
  folder:
    type: string
    description: For a command action, where to run it. Defaults to the workspace folder.
  accepted:
    type: string
    description: The command line you accepted, kept by the system. A command runs only while it matches this.
    readonly: true
  show:
    label: On the canvas
    type: bool
    default: false
    description: For a webhook or a command, put the answer on the canvas as a text block, kept up to date on every run.
  arrangement:
    type: string
    description: For an arrangement action, its name from the catalogue.
  message:
    type: text
    description: For a message action, what to say to the assistant.
  block:
    type: string
    description: The canvas block that shows this action's answer, kept by the system.
  every:
    label: Schedule
    type: enum
    values: [never, hour, day, week]
    labels: {never: Only when pressed, hour: Every hour, day: Every day, week: Every week}
    default: never
    description: How often it runs on its own.
  at:
    type: string
    description: For day or week, HH:MM on this machine's clock.
  on:
    type: enum
    values: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    description: For every week, which day.
  when:
    label: When
    type: enum
    values: [added, changed, removed]
    labels: {added: A record is added, changed: A record comes to match, removed: A record is removed}
    description: Run when a what record is added, comes to match only (any change if none), or is removed.
  what:
    label: Of
    type: string
    description: The type when watches.
  only:
    label: Only if
    type: list
    description: Conditions, as a list takes them (status=done).
  then:
    label: Then
    type: ref
    to: action
    description: Run next, with {{result}}.
  trigger:
    type: string
    description: A long secret word; POST /hook/<word> runs it.
  last_run:
    type: string
    description: When it last ran on its own, kept by the system.
    readonly: true
  tags:
    type: list
    of: string
    description: "For a classify action, the tags it may give, by name; empty is every tag there is. Each tag says what it means on its own page."
  apart:
    label: Each tag on its own
    type: bool
    default: false
    description: For a classify action, ask about each tag separately rather than all at once; slower, and steadier with many tags.
  check:
    label: Check with your past choices
    type: bool
    default: false
    description: "For a classify or suggest action, show the assistant how you dealt with the latest it tagged or suggested, newest first, as examples to follow: the tags you kept, changed to or took off; the suggestions you made, changed or turned down. A tag your choices plainly settle is kept for you."
  examples:
    label: Past choices to show
    type: int
    default: 10
    description: For check, how many of the latest it is shown, newest first.
  make:
    label: Suggests a
    type: string
    description: "For a suggest action, the kind of record it suggests from what set it off: task, event, reminder, person, or any kind here. It is filled from the record and put to you to make, change or turn down. With check, it is shown what you did with its last suggestions."
