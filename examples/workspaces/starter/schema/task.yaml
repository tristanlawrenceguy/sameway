# Something to do, with a day it is due. Provided with every workspace, so
# a collection of what is due this week has something to show.
name: task
description: Something to do, with the day it is due, where it stands (To do, Doing, Done) and whether it is done.
title: title
provided: true
fields:
  title:
    type: string
    required: true
    maxLength: 200
  done:
    type: bool
    default: false
  status:
    type: enum
    values: [todo, doing, done]
    labels: {todo: To do, doing: Doing, done: Done}
    default: todo
    description: "Where it stands, for a board of tasks. Kept in step with done: a Done task is ticked, ticking one makes it Done, and unticked it goes back to To do."
  due:
    type: datetime
    description: When it is due; a day is enough.
  repeat:
    type: repeat
    description: How often it is due again, in words, like every weekday or every month on the 1st; empty for once. Marked done, it is due again on its next day, counted from the day it was due.
  for:
    type: ref
    to: person
    label: For
    description: Who it is for, when it is for someone. They hear of it on their own computer, and see it in their colour.
  project:
    type: ref
    to: project
    listed: true
    description: The project it belongs to, if any.
  event:
    type: ref
    to: event
    label: Came up at
    description: The meeting it came up at, if any.
  notes:
    type: markdown
    description: Anything worth remembering about it.
  tags:
    type: list
    of: string
    description: Keywords for finding the task.
