# One component on the canvas, which is the whole home page.
# The assistant's tools create these; `sameway block list` shows them.
name: block
description: A component placed on the canvas, with its props, its place in the layout, and who last changed it.
internal: true
title: component
fields:
  component:
    type: string
    required: true
    description: Name of a component from the design system or the workspace.
  props:
    type: json
    description: Props object matching the component's manifest schema.
  position:
    type: int
    default: 0
    description: Sort order on the canvas, lowest first.
  span:
    type: int
    default: 6
    description: Width in columns of a twelve column grid. 12 is full width, 6 is half, 4 is a third. Ignored on narrow screens, where every block is full width.
  frame:
    type: enum
    values: [card, bare]
    default: card
    description: card gives the block a surface; bare lets it sit flush on the page with no border or shadow.
  tone:
    type: enum
    values: [none, accent, success, warning, danger, info]
    default: none
    description: Tints the block's surface. Body text keeps its contrast on every tint.
  actor:
    type: enum
    values: [human, assistant]
    default: assistant
    description: Who last changed this block.
  created_by:
    type: enum
    values: [human, assistant]
    default: assistant
    description: Who first added this block.
