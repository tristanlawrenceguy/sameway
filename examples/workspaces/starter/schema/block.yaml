# A component placed on the canvas of the home page by the assistant or by you.
# The assistant's add_component tool creates these; `sameway block list` shows them.
name: block
description: A rendered component on the canvas, with its props.
internal: true
title: component
fields:
  component:
    type: string
    required: true
    description: Name of a component from the design system or the workspace.
  props:
    type: json
    description: Props object matching the component's manifest schema.
  position:
    type: int
    default: 0
    description: Sort order on the canvas, lowest first.
