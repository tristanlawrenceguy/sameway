# One component on the canvas, which is the whole home page.
# The assistant's tools create these; `sameway block list` shows them.
name: block
description: A component placed on the canvas, with its props, its place in the layout, and who last changed it.
internal: true
title: component
fields:
  component:
    type: string
    required: true
    description: Name of a component from the design system or the workspace.
  props:
    type: json
    description: Props object matching the component's manifest schema.
  position:
    type: int
    default: 0
    description: Sort order on the canvas, lowest first.
  span:
    type: int
    default: 6
    description: Width in columns of a twelve column grid. 12 is full width, 6 is half, 4 is a third. Ignored on narrow screens, where every block is full width.
  canvas:
    type: string
    default: ""
    description: Which tab this block is on, as a canvas id. Empty is Home, the first canvas.
  region:
    type: enum
    values: [main, left, right, header, footer]
    default: main
    description: main is the body of the page. left and right are full height panes beside it, each collapsible; left is where chat history and navigation usually go, right is for things you glance at like a calendar or what is due next. header is the bar at the top beside the name, for what a person reaches for on every page, such as search; footer is the bar at the bottom.
  size:
    type: enum
    values: [full, compact, icon]
    default: full
    description: full is the whole thing. compact is the same with less room, for fitting more on a page. icon is a glyph with the block's name for screen readers, which opens the full thing on its own page; for people who know what it is.
  frame:
    type: enum
    values: [card, bare]
    default: card
    description: card gives the block a surface; bare lets it sit flush on the page with no border or shadow.
  tone:
    type: enum
    values: [none, accent, success, warning, danger, info]
    default: none
    description: Tints the block's surface. Body text keeps its contrast on every tint.
  actor:
    type: enum
    values: [human, assistant, system]
    default: assistant
    description: Who last changed this block.
  created_by:
    type: enum
    values: [human, assistant, system]
    default: assistant
    description: Who first added this block.
