# Someone you deal with. Provided with every workspace, so contacts can
# be imported from a vCard or a CSV and interactions can be with someone.
name: person
description: "Someone you deal with: how to reach them, where they work, and what to remember. Interactions and follow-ups hang off a person."
title: name
provided: true
fields:
  name:
    type: string
    required: true
    maxLength: 200
  email:
    type: string
    description: Their email address. An import matches people by it, so nobody is made twice.
  phone:
    type: string
    description: Their phone number, as written.
  organisation:
    type: string
    description: Where they work, or who they are with.
  role:
    type: string
    description: What they do there.
  notes:
    type: markdown
    description: Anything worth remembering about them.
  tags:
    type: list
    of: string
    description: "Keywords for finding them: client, supplier, family."
  access:
    type: enum
    values: [view, edit, host]
    labels: {view: "Can look", edit: "Can edit", host: "Hosts a copy"}
    readonly: true
    description: "What they may do in this workspace when they open it over Tailscale, signed in with the email above: view (read only), edit (content, the canvas, actions), or host (edit, and their own computer keeps a copy of the workspace in step with this one). Empty is no access. Sameway keeps it: it changes only when the owner answers yes to letting someone in."
  sameway:
    label: Their Sameway
    type: string
    maxLength: 200
    description: "Where their own Sameway is on Tailscale, such as home.tail1234.ts.net, when they have one. With it, the assistant can ask their Sameway when they are free (ask_someone)."
  may_ask:
    label: May ask
    type: list
    of: string
    readonly: true
    description: "What their own Sameway may ask this one and be told without asking you: free is the times you are busy between two moments, never what you are doing. Anything else waits for your yes. Empty is nothing. Sameway keeps it: it changes only when the owner says yes (let_ask)."
  always:
    label: Made without asking
    type: list
    of: string
    description: "What they may ask the assistant for and have made without your yes, each a kind of change in words: notes, changes to tasks. It is added when you press Always on one of their requests; take one out to be asked again."
