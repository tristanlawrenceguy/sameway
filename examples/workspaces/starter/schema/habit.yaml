# Something to keep up: once a day, eight glasses, five kilometres a week;
# or something to keep within: a monthly allowance of hours, a weekly
# budget; or a measure only recorded, such as weight.
# Provided with every workspace, so tracking needs no schema of your own:
# a tracker block shows each habit against its target, its streak and the
# last days at a glance, with a press to log; the habit's own page has the
# numbers and a chart.
name: habit
description: "Something to keep up or keep within, or a measure to record: each day, week, month or year, at least a target, at most a limit, or no target. Entries logged against it give this period against the target, what is left or over, the streak, the best run, and progress on a longer goal."
title: name
provided: true
fields:
  name:
    type: string
    required: true
    maxLength: 120
  cadence:
    type: enum
    values: [day, week, month, year]
    labels: {day: Each day, week: Each week, month: Each month, year: Each year}
    default: day
    description: The period a target applies to.
  target:
    type: float
    default: 1
    description: "What a period is aimed at: 1 for once, 8 for eight glasses, 5 for five kilometres, 21 hours a month for a limit."
  aim:
    type: enum
    values: [reach, limit, record]
    labels: {reach: At least the target, limit: At most the target, record: Just keep a record}
    default: reach
    description: "reach is at least the target; limit is at most, what goes past it is over (an allowance, a budget, screen time); record has no target, only the numbers (weight)."
  combine:
    type: enum
    values: [sum, latest, average]
    labels: {sum: Add them up, latest: The latest one, average: The average}
    default: sum
    description: "How a period's entries make its amount: sum adds them up; latest is the last one logged (a reading such as weight); average is their mean (hours slept)."
  unit:
    type: string
    description: "What is counted: glasses, km, minutes, pages. Empty when it is simply done or not."
  goal:
    type: float
    description: A total to reach over time, in the unit, such as 100 km; empty for none.
  by:
    type: datetime
    description: When to reach the goal by, if there is one.
  notes:
    type: markdown
  tags:
    type: list
    of: string
  remind:
    type: string
    maxLength: 20
    description: "A time of day, such as 20:00 or 8pm: if the habit is not met by then, the clock rings a reminder about it, once a day."
  archived:
    type: bool
    default: false
    description: Kept but no longer tracked; a tracker leaves it out.
