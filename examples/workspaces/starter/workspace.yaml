# Sameway workspace. Share this folder with git; data.db is ignored.
name: My Sameway

server:
  addr: 127.0.0.1:8080

# Which model the chat page talks to. Keys never go in this file: set the
# environment variable named in api_key_env instead.
llm:
  # openai = any OpenAI-compatible server (Ollama, LM Studio, llama.cpp,
  # OpenRouter, OpenAI). anthropic = the Claude API. none = chat disabled.
  provider: openai
  base_url: http://localhost:11434/v1
  model: llama3.1
  api_key_env: SAMEWAY_LLM_API_KEY
  max_tokens: 4096

  # Claude example:
  # provider: anthropic
  # model: claude-opus-5
  # api_key_env: ANTHROPIC_API_KEY

  # No API key: a program you are signed in to, which runs the tools
  # itself over this workspace's MCP server. claude-code is known;
  # any other takes command: with {prompt}, {system} and {mcp}.
  # provider: claude-code
  # model: haiku        # or sonnet, opus; leave out for the default model

ui:
  # auto: per-item controls and provenance labels fade until you hover a
  # block or tab into it. They stay in the accessibility tree either way,
  # so screen readers and agents always have them.
  # visible: keep them on screen all the time.
  controls: auto
  # filled: the sidebar lists what has something in it, and any list you
  # made yourself. all: every list, empty or not.
  lists: filled
  # hidden: the design system page and the guide for agents keep out of
  # the way (they are still there, at /design and /api/describe).
  # shown: their links are in the sidebar and the footer.
  developer: hidden

# What a command action may run. A command action runs a program on this
# machine as you, once you have accepted its line; only programs named
# here run, directly, never through a shell. Name them comma separated:
# curl, python, mosquitto_pub. Empty means command actions run nothing.
actions:
  allow: ""

# Devices, over MQTT. Zigbee2MQTT, Tasmota, ESPHome and Home Assistant
# all speak it or bridge to it. subscribe lists the topics whose messages
# become device records (zigbee2mqtt/+ takes every Zigbee device); an
# mqtt action publishes to a topic (zigbee2mqtt/kitchen_light/set). Set
# username_env and password_env to the NAMES of environment variables
# when the broker wants a login. Empty broker means no devices.
mqtt:
  broker: ""
  client_id: sameway
  username_env: ""
  password_env: ""
  subscribe: []

# How a reminder reaches you when no page is open. desktop shows the
# system's own notification on this machine. command runs for each ring
# with {title}, {text} and {url} in its arguments: a push service such as
# ntfy (curl -d "{title}" ntfy.sh/your-topic) reaches a phone; a mail or
# messaging command reaches an inbox. Leave command empty for none.
notify:
  desktop: on
  command: ""

# Open this workspace from your phone or another computer, anywhere, over
# your own Tailscale network: nothing public, no port forwarding. Name the
# machine here (home becomes https://home.<your-tailnet>.ts.net) and the
# first start prints a link to sign in once. For a machine nobody signs in
# on, set auth_key_env to the NAME of a variable holding an auth key.
# Anyone your tailnet's access rules let in can open it. Empty name is off.
tailnet:
  name: ""
  auth_key_env: ""

# How a new version of sameway itself arrives. auto: a release published
# for this machine is downloaded, checked against the checksums published
# with it, and put where this program is, with a line in the activity log
# saying which version. manual: you are only told a new version is out,
# and it waits until you ask — say "update" to the assistant, or run
# `sameway update`. Either way the new version runs from the next start,
# and a sameway built from source never replaces itself with a release.
update:
  mode: auto

chat:
  # How many past messages to send to the model each turn.
  history_limit: 40
  # Extra instructions added to the built-in system prompt.
  system_prompt: ""
