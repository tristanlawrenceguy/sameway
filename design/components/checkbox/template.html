{{$id := or .id .name}}<div class="sw-checkbox" data-component="checkbox"><input class="sw-checkbox__input" type="checkbox" id="{{$id}}" name="{{.name}}" value="{{.value}}"{{if .checked}} checked{{end}}{{if .hint}} aria-describedby="{{$id}}-hint"{{end}}><label class="sw-checkbox__label" for="{{$id}}">{{.label}}</label>{{if .hint}}<p class="sw-checkbox__hint" id="{{$id}}-hint">{{.hint}}</p>{{end}}</div>
