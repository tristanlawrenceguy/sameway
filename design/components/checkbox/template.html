{{$id := or .id .name}}<div class="sw-checkbox{{if .error}} sw-checkbox--error{{end}}" data-component="checkbox">{{if .error}}<p class="sw-checkbox__error" id="{{$id}}-error">{{.error}}</p>{{end}}<input class="sw-checkbox__input" type="checkbox" id="{{$id}}" name="{{.name}}" value="{{.value}}"{{if .checked}} checked{{end}}{{if .required}} required aria-required="true"{{end}}{{if .error}} aria-invalid="true"{{end}}{{if or .hint .error}} aria-describedby="{{if .hint}}{{$id}}-hint{{end}}{{if and .hint .error}} {{end}}{{if .error}}{{$id}}-error{{end}}"{{end}}><label class="sw-checkbox__label" for="{{$id}}">{{.label}}{{if .required}} <span class="sw-checkbox__required">(required)</span>{{end}}</label>{{if .hint}}<p class="sw-checkbox__hint" id="{{$id}}-hint">{{.hint}}</p>{{end}}</div>
