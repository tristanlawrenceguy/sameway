<!-- The /search page sets <h1>Search</h1> via s.page(). This component renders only the search form below. -->
<form class="sw-search" role="search" aria-label="{{.label}}" method="get" action="{{.action}}" data-component="search"><label class="sw-search__label" for="{{.id}}">{{.label}}</label><input class="sw-search__field" type="search" id="{{.id}}" name="q" value="{{.value}}" enterkeyhint="search"><button type="submit" class="sw-button sw-button--secondary sw-pressable">{{.label}}</button></form>
