<div class="sw-alert sw-alert--{{.kind}}" role="{{if or (eq .kind "warning") (eq .kind "danger")}}alert{{else}}status{{end}}" data-component="alert" data-kind="{{.kind}}"{{if .id}} id="{{.id}}"{{end}}><p class="sw-alert__title">{{if .icon}}<span class="sw-alert__icon" aria-hidden="true">{{.icon}}</span>{{end}}<span class="sw-alert__kind">{{if eq .kind "info"}}Note{{else if eq .kind "success"}}Success{{else if eq .kind "warning"}}Warning{{else}}Error{{end}}:</span>{{if .title}} {{.title}}{{end}}</p><p class="sw-alert__message" data-prop="message">{{.message}}</p></div>
