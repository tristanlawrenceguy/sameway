<!-- Example: kind=success, title="Changes saved", message="Your edits were applied." -->
<div class="sw-alert sw-alert--{{.kind}}" role="{{if or (eq .kind "warning") (eq .kind "danger")}}alert{{else}}status{{end}}" data-component="alert" data-kind="{{.kind}}"{{if .id}} id="{{.id}}"{{end}}><p class="sw-alert__title">{{if .icon}}<span class="sw-alert__icon">{{.icon}}</span>{{end}}{{if ne .kind "success"}}<span class="sw-alert__kind">{{if eq .kind "info"}}Note{{else if eq .kind "warning"}}Warning{{else}}Error{{end}}:</span>{{end}}{{if .title}} {{.title}}{{end}}</p><p class="sw-alert__message" data-prop="message">{{.message}}</p>{{if .dismiss}}<button type="button" class="sw-alert__close" data-dismiss aria-label="Close">×</button>{{end}}</div>
