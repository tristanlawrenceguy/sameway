<!-- Example: kind=success, title="Changes saved", message="Your edits were applied." -->
<div class="sw-alert sw-alert--{{.kind}}" role="{{if or (eq .kind "warning") (eq .kind "danger")}}alert{{else}}status{{end}}" aria-live="{{if or (eq .kind "warning") (eq .kind "danger")}}assertive{{else}}polite{{end}}" data-component="alert" data-kind="{{.kind}}"{{if .id}} id="{{.id}}"{{end}}><p class="sw-alert__title{{if not .title}} sw-alert__title--bare{{end}}">{{if .icon}}<span class="sw-alert__icon">{{.icon}}</span>{{else if or (eq .kind "warning") (eq .kind "danger")}}<span class="sw-alert__icon">⚠</span>{{else if eq .kind "info"}}<span class="sw-alert__icon">ℹ</span>{{end}}{{if .title}} {{.title}}{{end}}</p><p class="sw-alert__message" data-prop="message">{{.message}}</p>{{if .dismiss}}<button type="button" class="sw-alert__close" data-dismiss aria-label="Close">×</button>{{end}}</div>
