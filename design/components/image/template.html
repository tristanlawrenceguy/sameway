{{define "img"}}<img class="sw-image__img" src="{{or .still .src}}" alt="{{.alt}}"{{if .still}} data-moving="{{.src}}" data-still="{{.still}}"{{end}} loading="{{or .loading "lazy"}}"{{if .width}} width="{{.width}}"{{end}}{{if .height}} height="{{.height}}"{{end}}>{{end}}{{if .caption}}<figure class="sw-image" data-component="image"{{if .id}} id="{{.id}}"{{end}}>{{template "img" .}}<figcaption class="sw-image__caption">{{.caption}}</figcaption></figure>{{else}}<p class="sw-image" data-component="image"{{if .id}} id="{{.id}}"{{end}}>{{template "img" .}}</p>{{end}}
