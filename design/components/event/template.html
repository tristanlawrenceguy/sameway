<div class="sw-event" data-component="event" data-actor="{{.actor}}" data-action="{{.action}}"{{if .target}} data-target="{{.target}}"{{end}}{{if .id}} id="{{.id}}"{{end}}><span class="sw-event__mark" aria-hidden="true"></span><span class="sw-event__text"><span class="sw-event__actor">{{if eq .actor "human"}}You{{else if eq .actor "assistant"}}Assistant{{else}}System{{end}}</span> <span class="sw-event__action">{{.action}}</span>{{if .target}} <span class="sw-event__target">{{.target}}</span>{{end}}{{if .detail}} <span class="sw-event__detail">{{.detail}}</span>{{end}}</span>{{if .time}} <time class="sw-event__time">{{.time}}</time>{{end}}</div>
