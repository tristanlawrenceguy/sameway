{{$id := or .id "audio"}}<figure class="sw-audio" data-component="audio" id="{{$id}}" aria-labelledby="{{$id}}-title"><figcaption class="sw-audio__title" id="{{$id}}-title">{{.title}}</figcaption><audio class="sw-audio__media" controls preload="metadata" aria-labelledby="{{$id}}-title"><source src="{{.src}}"{{if .type}} type="{{.type}}"{{end}}><a class="sw-link" href="{{.src}}">Open {{.title}}</a></audio><p class="sw-audio__about">{{if .about}}<span class="sw-audio__facts">{{.about}}</span> {{end}}<a class="sw-link" href="{{.src}}" download>Download<span class="sw-visually-hidden"> {{.title}}</span></a></p>{{if .cues}}<details class="sw-audio__transcript"{{if le (len .cues) 60}} open{{end}}><summary class="sw-pressable">Transcript<span class="sw-visually-hidden"> of {{.title}}</span></summary><ol class="sw-plain sw-audio__cues">{{range .cues}}<li class="sw-audio__cue" data-start="{{.start}}"><a class="sw-link sw-audio__at" href="{{$.src}}#t={{.start}}"><span aria-hidden="true">{{.at}}</span><span class="sw-visually-hidden">Play from {{or .said .at}}</span></a> <span class="sw-audio__said">{{if .speaker}}<span class="sw-audio__speaker">{{.speaker}}:</span> {{end}}{{.text}}</span></li>{{end}}</ol></details>{{else}}<p class="sw-audio__none">{{or .none "No transcript yet."}}</p>{{end}}</figure>
