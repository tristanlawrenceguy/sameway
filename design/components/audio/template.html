{{$id := or .id "audio"}}<figure class="sw-audio" data-component="audio" id="{{$id}}" aria-labelledby="{{$id}}-title"><figcaption class="sw-audio__title" id="{{$id}}-title">{{.title}}</figcaption><audio class="sw-audio__media" controls preload="metadata" aria-labelledby="{{$id}}-title"><source src="{{.src}}"{{if .type}} type="{{.type}}"{{end}}><a class="sw-link" href="{{.src}}">Open {{.title}}</a></audio><p class="sw-audio__about">{{if .about}}<span class="sw-audio__facts">{{.about}}</span> {{end}}<a class="sw-link" href="{{.src}}" download>Download<span class="sw-visually-hidden"> {{.title}}</span></a></p>{{if .cues}}<details class="sw-audio__transcript"{{if le (len .cues) 60}} open{{end}}><summary class="sw-pressable">Transcript<span class="sw-visually-hidden"> of {{.title}}</span></summary><ol class="sw-plain sw-audio__cues">{{range .cues}}<li class="sw-audio__cue" data-start="{{.start}}"><a class="sw-link sw-audio__at" href="{{$.src}}#t={{.start}}"><span aria-hidden="true">{{.at}}</span><span class="sw-visually-hidden">Play from {{or .said .at}}</span></a> <span class="sw-audio__said">{{if .speaker}}<span class="sw-audio__speaker">{{.speaker}}:</span> {{end}}{{.text}}</span></li>{{end}}</ol></details>{{else}}<p class="sw-audio__none">{{or .none "No transcript yet."}}</p>{{if .make}}<form class="sw-audio__make" method="post" action="{{.make.action}}"{{if .make.auto}} data-auto{{end}}><button type="submit" class="sw-button sw-button--secondary sw-pressable">Write it down<span class="sw-visually-hidden">: {{.title}}</span></button><span class="sw-audio__making" role="status"></span></form>{{end}}{{if .get}}<form class="sw-audio__get" method="post" action="{{.get.action}}"><p class="sw-audio__why">It can be written down on this computer. That needs speech-to-text, about {{.get.size}} downloaded once from GitHub and Hugging Face and kept for every workspace here. Recordings never leave this computer.</p><button type="submit" class="sw-button sw-button--secondary sw-pressable">Get speech-to-text</button></form>{{end}}{{end}}</figure>
