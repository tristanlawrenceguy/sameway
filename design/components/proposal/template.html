<div class="sw-proposal" data-component="proposal" data-actor="assistant" role="group" aria-label="{{.summary}}"{{if .id}} id="{{.id}}"{{end}}><p class="sw-proposal__summary">{{.summary}}</p>{{if .detail}}<p class="sw-proposal__detail">{{.detail}}</p>{{end}}<div class="sw-proposal__answers"><form method="post" action="{{.accept}}"><button type="submit" class="sw-button sw-button--primary sw-pressable">{{.acceptLabel}}</button></form><form method="post" action="{{.dismiss}}"><button type="submit" class="sw-button sw-button--secondary sw-pressable">{{.dismissLabel}}</button></form></div></div>
