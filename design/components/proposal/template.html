{{$id := or .id "proposal"}}<div class="sw-proposal{{if .risk}} sw-proposal--risk{{end}}" data-component="proposal" data-actor="assistant" role="group" aria-labelledby="{{$id}}-ask"{{if or .detail .risk}} aria-describedby="{{if .detail}}{{$id}}-detail{{end}}{{if and .detail .risk}} {{end}}{{if .risk}}{{$id}}-risk{{end}}"{{end}} id="{{$id}}"><p class="sw-proposal__summary" id="{{$id}}-ask">{{.summary}}</p>{{if .detail}}<p class="sw-proposal__detail" id="{{$id}}-detail">{{.detail}}</p>{{end}}{{if .risk}}<p class="sw-proposal__risk" id="{{$id}}-risk"><span class="sw-proposal__mark" aria-hidden="true">!</span> This cannot be undone.</p>{{end}}<div class="sw-proposal__answers">{{if .instead}}<form method="post" action="{{.instead}}">{{if .from}}<input type="hidden" name="from" value="{{.from}}">{{end}}<button type="submit" class="sw-button sw-button--primary sw-pressable">{{.insteadLabel}}</button></form>{{end}}<form method="post" action="{{.accept}}">{{if .from}}<input type="hidden" name="from" value="{{.from}}">{{end}}<button type="submit" class="sw-button {{if .risk}}sw-button--danger{{else if .instead}}sw-button--secondary{{else}}sw-button--primary{{end}} sw-pressable">{{.acceptLabel}}</button></form><form method="post" action="{{.dismiss}}">{{if .from}}<input type="hidden" name="from" value="{{.from}}">{{end}}<button type="submit" class="sw-button sw-button--secondary sw-pressable">{{.dismissLabel}}</button></form></div></div>
