<div class="sw-proposal" data-component="proposal" data-actor="assistant" role="group" aria-label="{{.summary}}"{{if .id}} id="{{.id}}"{{end}}><p class="sw-proposal__summary">{{.summary}}</p>{{if .detail}}<p class="sw-proposal__detail">{{.detail}}</p>{{end}}<div class="sw-proposal__answers">{{if .instead}}<form method="post" action="{{.instead}}">{{if .from}}<input type="hidden" name="from" value="{{.from}}">{{end}}<button type="submit" class="sw-button sw-button--primary sw-pressable">{{.insteadLabel}}</button></form>{{end}}<form method="post" action="{{.accept}}">{{if .from}}<input type="hidden" name="from" value="{{.from}}">{{end}}<button type="submit" class="sw-button {{if .instead}}sw-button--secondary{{else}}sw-button--primary{{end}} sw-pressable">{{.acceptLabel}}</button></form><form method="post" action="{{.dismiss}}">{{if .from}}<input type="hidden" name="from" value="{{.from}}">{{end}}<button type="submit" class="sw-button sw-button--secondary sw-pressable">{{.dismissLabel}}</button></form></div></div>
