{{if .label}}{{if eq (print .level) "2"}}<h2 class="sw-list__title">{{.label}}</h2>{{else if eq (print .level) "4"}}<h4 class="sw-list__title">{{.label}}</h4>{{else}}<h3 class="sw-list__title">{{.label}}</h3>{{end}}{{end}}{{if .ordered}}<ol class="sw-list" data-component="list"{{if .id}} id="{{.id}}"{{end}}>{{range .items}}<li>{{.}}</li>{{end}}</ol>{{else}}<ul class="sw-list" data-component="list"{{if .id}} id="{{.id}}"{{end}}>{{range .items}}<li>{{.}}</li>{{end}}</ul>{{end}}
