<form class="sw-mark" method="post" action="/t/{{.type}}/{{.record}}/props" data-component="mark" data-record-type="{{.type}}" data-record-id="{{.record}}" data-field="{{.field}}"{{if .id}} id="{{.id}}"{{end}}><label class="sw-mark__label"><input class="sw-mark__input" type="checkbox" name="prop-{{.field}}" value="true"{{if .checked}} checked{{end}}> {{.label}}{{if .context}}<span class="sw-visually-hidden"> {{.context}}</span>{{end}}</label><input type="hidden" name="prop-{{.field}}" value="false"><button type="submit" class="sw-button sw-button--quiet sw-pressable sw-mark__save">Save</button></form>
