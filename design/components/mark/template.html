<form class="sw-mark" method="post" action="/t/{{.type}}/{{.record}}/props" data-component="mark" data-record-type="{{.type}}" data-record-id="{{.record}}" data-field="{{.field}}"{{if .id}} id="{{.id}}"{{end}}><input type="hidden" name="prop-{{.field}}" value="{{.value}}"><button type="submit" class="sw-button sw-button--quiet sw-pressable">{{.label}}{{if .context}}<span class="sw-visually-hidden"> {{.context}}</span>{{end}}</button></form>
