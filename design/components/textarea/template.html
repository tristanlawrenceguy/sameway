{{$id := or .id .name}}<div class="sw-field" data-component="textarea"><label class="sw-field__label" for="{{$id}}">{{.label}}{{if .required}} <span class="sw-field__required">(required)</span>{{end}}</label>{{if .hint}}<p class="sw-field__hint" id="{{$id}}-hint">{{.hint}}</p>{{end}}{{if .error}}<p class="sw-field__error" id="{{$id}}-error">{{.error}}</p>{{end}}<textarea class="sw-field__textarea" id="{{$id}}" name="{{.name}}" rows="{{.rows}}"{{if .required}} required aria-required="true"{{end}}{{if .error}} aria-invalid="true"{{end}}{{if or .hint .error}} aria-describedby="{{if .hint}}{{$id}}-hint{{end}}{{if and .hint .error}} {{end}}{{if .error}}{{$id}}-error{{end}}"{{end}}>{{.value}}</textarea></div>
