{{$id := or .id .name}}<div class="sw-field sw-lookup" data-component="lookup" data-to="{{.to}}"><label class="sw-field__label" for="{{$id}}">{{.label}}{{if .required}} <span class="sw-field__required">(required)</span>{{end}}</label><p class="sw-field__hint" id="{{$id}}-hint">{{.hint}}</p><input class="sw-field__input" id="{{$id}}" type="text" value="{{.title}}" list="{{$id}}-list" autocomplete="off"{{if .required}} required aria-required="true"{{end}} aria-describedby="{{$id}}-hint"><input type="hidden" name="{{.name}}" value="{{.value}}"><datalist id="{{$id}}-list"></datalist></div>
