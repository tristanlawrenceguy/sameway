<div class="sw-error-summary" data-component="error-summary" id="{{.id}}" role="alert" tabindex="-1" aria-labelledby="{{.id}}-title"><h2 class="sw-error-summary__title" id="{{.id}}-title"><span class="sw-error-summary__mark" aria-hidden="true">!</span><span class="sw-visually-hidden">Error: </span>{{.title}}</h2><ul class="sw-plain sw-error-summary__list">{{range $i, $p := .items}}<li id="{{$.id}}-{{$i}}">{{if or $p.href $p.field}}<a class="sw-link" href="{{if $p.href}}{{$p.href}}{{else}}#field-{{$p.field}}{{end}}"{{if $p.field}} data-field="{{$p.field}}"{{end}}>{{$p.text}}</a>{{else}}{{$p.text}}{{end}}</li>{{end}}</ul></div>
