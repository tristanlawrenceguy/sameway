<div class="sw-error-summary" data-component="error-summary" id="{{.id}}" role="alert" tabindex="-1" aria-labelledby="{{.id}}-title"><h2 class="sw-error-summary__title" id="{{.id}}-title">{{.title}}</h2><ul class="sw-plain sw-error-summary__list">{{range $i, $p := .items}}<li id="{{$.id}}-{{$i}}"><a class="sw-link" href="{{if $p.href}}{{$p.href}}{{else if $p.field}}#field-{{$p.field}}{{else}}#main{{end}}"{{if $p.field}} data-field="{{$p.field}}"{{end}}>{{$p.text}}</a></li>{{end}}</ul></div>
