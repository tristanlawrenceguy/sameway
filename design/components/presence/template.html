<p class="sw-present" data-component="presence">{{or .label "Also here"}}: {{range $i, $p := .people}}{{if $i}}; {{end}}<span class="sw-present__who"{{if $p.here}} data-here{{end}}>{{child (dict "component" "person" "props" (dict "name" $p.name "colour" $p.colour))}}{{if $p.here}}, on this page{{else if $p.place}}, on {{$p.place}}{{end}}</span>{{end}}</p>
