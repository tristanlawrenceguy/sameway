{{with pages .href .page .pages}}<nav class="sw-pagination" data-component="pagination" aria-label="{{$.label}}">{{if .Prev}}<a class="sw-link sw-pagination__step sw-pagination__prev" href="{{.Prev}}" rel="prev">Previous<span class="sw-visually-hidden"> page</span></a>{{end}}<ul class="sw-plain sw-pagination__list">{{range .Items}}{{if .Gap}}<li class="sw-pagination__gap" aria-hidden="true">…</li>{{else}}<li><a class="sw-link sw-pagination__page" href="{{.Href}}"{{if .Current}} aria-current="page"{{end}}><span class="sw-visually-hidden">Page </span>{{.N}}</a></li>{{end}}{{end}}</ul>{{if .Next}}<a class="sw-link sw-pagination__step sw-pagination__next" href="{{.Next}}" rel="next">Next<span class="sw-visually-hidden"> page</span></a>{{end}}</nav>{{end}}
