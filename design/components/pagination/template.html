{{with pages .href .page .pages}}<nav class="sw-pagination" data-component="pagination" aria-label="{{$.label}}"><ul class="sw-plain sw-pagination__list">{{if .Prev}}<li><a class="sw-link sw-pagination__step" href="{{.Prev}}" rel="prev">Previous<span class="sw-visually-hidden"> page</span></a></li>{{end}}{{range .Items}}{{if .Gap}}<li class="sw-pagination__gap" aria-hidden="true">…</li>{{else}}<li><a class="sw-link sw-pagination__page" href="{{.Href}}"{{if .Current}} aria-current="page"{{end}}><span class="sw-visually-hidden">Page </span>{{.N}}</a></li>{{end}}{{end}}{{if .Next}}<li><a class="sw-link sw-pagination__step" href="{{.Next}}" rel="next">Next<span class="sw-visually-hidden"> page</span></a></li>{{end}}</ul></nav>{{end}}
