{{$id := or .id "media"}}<figure class="sw-media" data-component="media" id="{{$id}}" aria-labelledby="{{$id}}-title"><figcaption class="sw-media__title" id="{{$id}}-title">{{.title}}</figcaption>{{if eq .kind "video"}}<video class="sw-media__player" controls preload="metadata" playsinline aria-labelledby="{{$id}}-title"><source src="{{.src}}"{{if .type}} type="{{.type}}"{{end}}>{{if .captions}}<track kind="captions" src="{{.captions}}" label="Captions" default>{{end}}<a class="sw-link" href="{{.src}}">Open {{.title}}</a></video>{{else}}<audio class="sw-media__player" controls preload="metadata" aria-labelledby="{{$id}}-title"><source src="{{.src}}"{{if .type}} type="{{.type}}"{{end}}><a class="sw-link" href="{{.src}}">Open {{.title}}</a></audio>{{end}}<p class="sw-media__about">{{if .about}}<span class="sw-media__facts">{{.about}}</span> {{end}}<a class="sw-link sw-link--button" href="{{.src}}" download>Download<span class="sw-visually-hidden"> {{.title}}</span></a></p>{{if .cues}}<details class="sw-media__transcript"{{if le (len .cues) 60}} open{{end}}><summary class="sw-pressable">Transcript<span class="sw-visually-hidden"> of {{.title}}</span></summary><ol class="sw-plain sw-media__cues">{{range .cues}}<li class="sw-media__cue" data-start="{{.start}}"><a class="sw-link sw-media__at" href="{{$.src}}#t={{.start}}"><span aria-hidden="true">{{.at}}</span><span class="sw-visually-hidden">Play from {{or .said .at}}</span></a> <span class="sw-media__said">{{if .speaker}}<span class="sw-media__speaker">{{.speaker}}:</span> {{end}}{{.text}}</span></li>{{end}}</ol>{{if .downloads}}{{child (dict "component" "export" "props" (dict "what" (print "the words of " $.title) "items" .downloads "id" (print $id "-words")))}}{{end}}</details>{{else}}<p class="sw-media__none">{{or .none "No transcript yet."}}</p>{{if .make}}<form class="sw-media__make" method="post" action="{{.make.action}}"{{if .make.auto}} data-auto{{end}}><button type="submit" class="sw-button sw-button--secondary sw-pressable">Write it down<span class="sw-visually-hidden">: {{.title}}</span></button><span class="sw-media__making" role="status"></span></form>{{end}}{{if .get}}<form class="sw-media__get" method="post" action="{{.get.action}}"><p class="sw-media__why">It can be written down on this computer. That needs speech-to-text, about {{.get.size}} downloaded once from GitHub and Hugging Face and kept for every workspace here. Recordings never leave this computer.</p><button type="submit" class="sw-button sw-button--secondary sw-pressable">Get speech-to-text</button></form>{{end}}{{end}}</figure>
