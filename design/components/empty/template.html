<div class="sw-empty" data-component="empty"{{if .live}} role="status"{{end}}>{{if .title}}{{if eq .level 3}}<h3 class="sw-empty__title">{{.title}}</h3>{{else if eq .level 4}}<h4 class="sw-empty__title">{{.title}}</h4>{{else}}<h2 class="sw-empty__title">{{.title}}</h2>{{end}}{{end}}<p class="sw-empty__message">{{.message}}{{if .action}} <a class="sw-link" href="{{.action.href}}">{{.action.label}}</a>{{end}}</p></div>
