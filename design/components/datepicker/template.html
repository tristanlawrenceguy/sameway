{{$id := or .id .name}}<div class="sw-field" data-component="datepicker"><label class="sw-field__label" for="{{$id}}">{{.label}}{{if .required}} <span class="sw-field__required">(required)</span>{{end}}</label>{{if .hint}}<p class="sw-field__hint" id="{{$id}}-hint">{{.hint}}</p>{{end}}{{if .error}}<p class="sw-field__error" id="{{$id}}-error">{{.error}}</p>{{end}}<input class="sw-field__input sw-datepicker" id="{{$id}}" name="{{.name}}" type="date" value="{{.value}}"{{if .min}} min="{{.min}}"{{end}}{{if .max}} max="{{.max}}"{{end}}{{if .required}} required aria-required="true"{{end}}{{if .error}} aria-invalid="true"{{end}}{{if or .hint .error}} aria-describedby="{{if .hint}}{{$id}}-hint{{end}}{{if and .hint .error}} {{end}}{{if .error}}{{$id}}-error{{end}}"{{end}}></div>
