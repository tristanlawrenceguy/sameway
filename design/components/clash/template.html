<section class="sw-panel sw-stack sw-clash" data-component="clash" aria-labelledby="clash-{{.id}}-h"><h2 id="clash-{{.id}}-h">Another version of {{.label}}</h2><p>It was written {{or .where "on another computer"}} at the same time as the one below, so both are kept. The page shows the later one; this is the other.</p><blockquote class="sw-clash__text">{{.text}}</blockquote><div class="sw-cluster"><form method="post" action="{{.use}}">{{if .from}}<input type="hidden" name="from" value="{{.from}}">{{end}}<button type="submit" class="sw-button sw-button--primary sw-pressable">Use this version</button></form><form method="post" action="{{.keep}}">{{if .from}}<input type="hidden" name="from" value="{{.from}}">{{end}}<button type="submit" class="sw-button sw-button--secondary sw-pressable">Keep the one below</button></form></div></section>
