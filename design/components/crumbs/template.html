<nav class="sw-crumbs" data-component="crumbs" aria-label="{{.label}}"><ol class="sw-plain sw-crumbs__list">{{range .items}}<li{{if .dot}} class="sw-dotted" data-dot="{{.dot}}"{{end}}><a class="sw-link" href="{{.href}}">{{.label}}</a></li>{{end}}{{if .current}}<li aria-current="page">{{.current}}</li>{{end}}</ol></nav>
