{{$id := or .id (print "voice-" .target)}}<div class="sw-voice" data-component="voice" data-mode="{{.mode}}" data-target="{{.target}}"{{if .action}} data-action="{{.action}}"{{end}} id="{{$id}}" hidden><button type="button" class="sw-button sw-button--secondary sw-pressable sw-voice__toggle"><span class="sw-voice__word">{{if eq .mode "dictate"}}Dictate{{else}}Record{{end}}</span>{{if .context}}<span class="sw-visually-hidden"> {{.context}}</span>{{end}}</button>{{if eq .sound "computer"}}<label class="sw-voice__also" hidden><input type="checkbox" class="sw-voice__computer"> Also record this computer's sound: the other people on a call</label>{{end}}<span class="sw-voice__time" role="timer" hidden>0:00</span><span class="sw-voice__said" role="status"></span></div>
