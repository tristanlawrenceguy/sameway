<dl class="sw-fields{{if .compact}} sw-fields--compact{{end}}" data-component="fields">{{range .items}}<dt>{{.label}}</dt>{{if .markdown}}<dd class="sw-prose"{{if .prop}} data-prop="{{.prop}}" data-source="{{.markdown}}" data-prose-level="{{or .level 3}}"{{end}}>{{markdown .markdown (or .level 3)}}</dd>{{else}}<dd{{if .prop}} data-prop="{{.prop}}"{{end}}{{if .kind}} data-kind="{{.kind}}"{{end}}{{if .source}} data-source="{{.source}}"{{end}}{{if .options}} data-options="{{json .options}}"{{end}}>{{if .href}}<a class="sw-link" href="{{.href}}">{{.value}}</a>{{else}}{{.value}}{{end}}</dd>{{end}}{{end}}</dl>
