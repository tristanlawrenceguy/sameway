{{$id := or .id "talk"}}<section class="sw-talk" data-component="talk" data-message="{{.message}}" data-action="{{.action}}" data-state="off" id="{{$id}}" aria-labelledby="{{$id}}-title" hidden><h3 class="sw-visually-hidden" id="{{$id}}-title">Voice mode</h3><div class="sw-talk__controls"><button type="button" class="sw-button sw-button--secondary sw-pressable sw-talk__toggle">Start voice mode</button><button type="button" class="sw-button sw-button--secondary sw-pressable sw-talk__done" hidden>Done speaking</button><button type="button" class="sw-button sw-button--secondary sw-pressable sw-talk__skip" hidden>Skip the reply</button><span class="sw-talk__state" role="status"></span></div>{{child (dict "component" "checkbox" "props" (dict "label" "Read replies aloud" "name" "talk-aloud" "id" (print $id "-aloud") "checked" true))}}<p class="sw-talk__novoice" hidden>This browser has no voice on this device, so replies are shown and not read aloud.</p></section>
