<form class="sw-upload" method="post" action="/t/file/upload" enctype="multipart/form-data" data-component="upload" data-busy-target="upload-status" data-busy-message="Adding the file…"><div class="sw-upload__pick"><label class="sw-upload__label sw-upload__label--file" for="upload">File to add</label><p class="sw-upload__hint sw-small sw-muted" id="upload-hint">Word, Excel, PowerPoint, PDF, text, CSV, web pages, EPUB and pictures are read; any other file is kept as it is. Up to 64 MB.</p><p class="sw-upload__error" id="upload-error" aria-live="polite"></p><input class="sw-upload__field" type="file" id="upload" name="file" required data-max="67108864" aria-describedby="upload-hint upload-error"><div class="sw-voice" data-component="voice" data-mode="record" data-target="upload" id="voice-upload" hidden><button type="button" class="sw-button sw-button--secondary sw-pressable sw-voice__toggle"><span class="sw-voice__word">Record</span></button><span class="sw-voice__time" role="timer" hidden>0:00</span><span class="sw-voice__said" role="status"></span></div></div><div class="sw-upload__about"><label class="sw-upload__label" for="upload-description">What the picture shows</label><span class="sw-upload__hint sw-small sw-muted" id="upload-description-hint">For anyone who cannot see it. Leave empty for other files.</span><input class="sw-upload__description" type="text" id="upload-description" name="description" aria-describedby="upload-description-hint"></div><button type="submit" class="sw-button sw-button--primary sw-pressable">Upload</button><p class="sw-status sw-status--idle" data-component="status" data-state="idle" role="status" aria-live="polite" id="upload-status"><span class="sw-status__dot" aria-hidden="true"></span><span class="sw-status__text"></span></p></form>
