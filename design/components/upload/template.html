<form class="sw-upload" method="post" action="{{.action}}" enctype="multipart/form-data" data-component="upload">{{if .from}}<input type="hidden" name="from" value="{{.from}}">{{end}}<label class="sw-upload__label" for="{{.id}}">Choose a file</label><input class="sw-upload__field" type="file" id="{{.id}}" name="file" required aria-describedby="{{.id}}-error"><span class="sw-upload__error" id="{{.id}}-error" role="status" aria-live="assertive"></span><label class="sw-upload__label" for="{{.id}}-description">What it shows, for a picture</label><span class="sw-upload__hint sw-small sw-muted" id="{{.id}}-description-hint">For anyone who cannot see it. Leave empty for other files.</span><input class="sw-upload__description" type="text" id="{{.id}}-description" name="description" aria-describedby="{{.id}}-description-hint"><button type="submit" class="sw-button sw-button--primary sw-pressable">{{.label}}</button></form>
