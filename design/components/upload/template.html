<form class="sw-upload" method="post" action="{{.action}}" enctype="multipart/form-data" data-component="upload">{{if .from}}<input type="hidden" name="from" value="{{.from}}">{{end}}<label class="sw-upload__label" for="{{.id}}">File</label><input class="sw-upload__field" type="file" id="{{.id}}" name="file" required><button type="submit" class="sw-button sw-button--primary sw-pressable">{{.label}}</button></form>
