<article class="sw-message sw-message--{{.role}}" data-component="message" data-role="{{.role}}"{{if .id}} id="{{.id}}"{{end}}><p class="sw-message__meta"><span class="sw-message__author">{{if .author}}{{.author}}{{else if eq .role "user"}}You{{else if eq .role "assistant"}}Assistant{{else}}System{{end}}</span>{{if .time}} <span class="sw-message__time">{{.time}}</span>{{end}}</p><div class="sw-message__body">{{range paragraphs .content}}<p>{{.}}</p>{{end}}</div></article>
