{{$id := or .id .name}}<div class="sw-field sw-when-field" data-component="when-field"{{if .repeat}} data-repeat{{end}}><label class="sw-field__label" for="{{$id}}">{{.label}}{{if .required}} <span class="sw-field__required">(required)</span>{{end}}</label><p class="sw-field__hint" id="{{$id}}-hint">{{.hint}}</p>{{if .error}}<p class="sw-field__error" id="{{$id}}-error"><span class="sw-visually-hidden">Error: </span>{{.error}}</p>{{end}}<div class="sw-when-field__row"><input class="sw-field__input" id="{{$id}}" name="{{.name}}" type="text" value="{{.value}}"{{if .required}} required aria-required="true"{{end}}{{if .error}} aria-invalid="true"{{end}} aria-describedby="{{$id}}-hint{{if .error}} {{$id}}-error{{end}}">{{if not .repeat}}<span class="sw-when-field__pick-row" hidden><label class="sw-when-field__pick-label" for="{{$id}}-pick">Or pick from a month</label><input class="sw-field__input sw-datepicker sw-when-field__pick" id="{{$id}}-pick" type="date" value="{{.day}}"></span>{{end}}</div><output class="sw-field__hint sw-when-field__read" id="{{$id}}-read" for="{{$id}}" hidden></output></div>
