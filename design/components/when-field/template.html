{{$id := or .id .name}}<div class="sw-field sw-when-field" data-component="when-field"><label class="sw-field__label" for="{{$id}}">{{.label}}{{if .required}} <span class="sw-field__required">(required)</span>{{end}}</label><p class="sw-field__hint" id="{{$id}}-hint">{{.hint}}</p>{{if .error}}<p class="sw-field__error" id="{{$id}}-error">{{.error}}</p>{{end}}<div class="sw-when-field__row"><input class="sw-field__input" id="{{$id}}" name="{{.name}}" type="text" value="{{.value}}"{{if .required}} required aria-required="true"{{end}}{{if .error}} aria-invalid="true"{{end}} aria-describedby="{{$id}}-hint{{if .error}} {{$id}}-error{{end}}"><input class="sw-field__input sw-datepicker sw-when-field__pick" type="date" value="{{.day}}" aria-label="Pick a day for {{.label}}" hidden></div></div>
