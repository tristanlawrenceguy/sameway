{{if ne (print .words) "false"}}<p class="sw-meter__words" aria-hidden="true"><span class="sw-meter__label">{{.label}}</span> <span class="sw-meter__amount">{{if .text}}{{.text}}{{else}}{{.value}} of {{.max}}{{end}}</span></p>{{end}}<div class="sw-meter" data-component="meter" data-state="{{.state}}" role="meter" aria-label="{{.label}}" aria-valuemin="0" aria-valuemax="{{.max}}" aria-valuenow="{{atMost .value .max}}"{{if .text}} aria-valuetext="{{.text}}"{{end}}{{if .id}} id="{{.id}}"{{end}}><span class="sw-meter__fill" style="width: {{percent .value .max}}%"></span>{{with pastPercent .value .max}}<span class="sw-meter__past" style="width: {{.}}%"></span>{{end}}</div>
