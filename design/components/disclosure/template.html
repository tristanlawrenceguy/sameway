<details class="sw-disclosure" data-component="disclosure"{{if .id}} id="{{.id}}"{{end}}{{if eq .remember "site"}} data-remember="site"{{end}}{{if .open}} open{{end}}><summary class="sw-disclosure__summary sw-twisty sw-pressable"><span class="sw-disclosure__label">{{.label}}</span>{{if .count}}<span class="sw-disclosure__count">{{.count}}<span class="sw-visually-hidden"> {{or .of "items"}}</span></span>{{end}}</summary><div class="sw-disclosure__body">{{.slot}}</div></details>
